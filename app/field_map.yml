# =============================================================================
# field_map.yml — G-ASET PDF form-field mapping (SME-editable)
# =============================================================================
# HOW TO USE:
#   * Replace every "REPLACE__..." value with the actual AcroForm field name
#     from your PDF version (use the app's Field Inspector to discover names).
#   * DO NOT change the option keys (left side of "key: field"). The scoring
#     engine matches on these keys (esp. items 6, 11, 14, 32).
#   * For checkboxes, the app treats /Yes, /On, /1, X, /Checked as "checked".
#   * If a translated PDF edition has different field names, keep one copy of
#     this file per edition (e.g., field_map_es.yml) and point the app at it,
#     or merge names if the publisher kept them identical across translations.
#
# SCORING REMINDERS (from CDC rubric, for orientation only — logic lives in
# scoring.py):
#   ypn        -> Yes=5 / Partially=2.5 / No=0
#   multi      -> count-based thresholds per item (noted in comments)
#   composite  -> items 6A, 11, 14: ID physician + any pharmacist + micro = 5
#   required   -> item 32: first_line+dose+duration+alternatives = 5
#   yescount   -> item 35A: >=9 yes = 5; 1-8 = 2.5; 0 = 0
# =============================================================================

